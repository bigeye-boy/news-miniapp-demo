name: Neux CI/CD

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: neux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:npm
      - run: npm run build -- --json
      - uses: actions/upload-artifact@v5
        with:
          name: neux-wgt-${{ github.sha }}
          path: dist/release/*.wgt
          if-no-files-found: error
          retention-days: 14

  upload-preview:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: neux-upload
    outputs:
      version_id: ${{ steps.upload.outputs.version_id }}
    env:
      NEUX_CLI_SERVER_URL: https://demo-c.paas.superapp.neuvision.cn
      NEUX_CLI_APP_ID: nxb6t2e7b73c83e
      NEUX_CLI_KEY_NXB6T2E7B73C83E: ${{ secrets.NEUX_CLI_KEY_NXB6T2E7B73C83E }}
      NEUX_VERSION_CODE_OFFSET: 1000

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:npm
      - name: Validate signed-service configuration
        run: |
          test -n "$NEUX_CLI_KEY_NXB6T2E7B73C83E"
          npx --no-install neux config doctor --json
      - name: Upload preview package
        id: upload
        run: |
          set -o pipefail
          version_code="$((NEUX_VERSION_CODE_OFFSET + GITHUB_RUN_NUMBER))"
          version_name="1.1.$((4 + GITHUB_RUN_NUMBER))"
          response_file="$(mktemp)"
          npx --no-install neux upload --preview \
            --version-name "$version_name" \
            --version-code "$version_code" \
            --changelog "GitHub Actions run ${GITHUB_RUN_NUMBER} (${GITHUB_SHA})" \
            --json | tee "$response_file"
          version_id="$(node - "$response_file" <<'NODE'
          const fs = require('node:fs')
          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'))
          function findVersionId(value) {
            if (!value || typeof value !== 'object') return ''
            if (value.versionId !== undefined && value.versionId !== null) return String(value.versionId)
            if (value.version_id !== undefined && value.version_id !== null) return String(value.version_id)
            for (const child of Object.values(value)) {
              const result = findVersionId(child)
              if (result) return result
            }
            return ''
          }
          process.stdout.write(findVersionId(payload))
          NODE
          )"
          if [ -z "$version_id" ]; then
            echo "Upload response did not include versionId" >&2
            exit 1
          fi
          echo "version_id=$version_id" >> "$GITHUB_OUTPUT"

  submit-audit:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: upload-preview
    runs-on: ubuntu-latest
    environment: neux-submit
    env:
      NEUX_CLI_SERVER_URL: https://demo-c.paas.superapp.neuvision.cn
      NEUX_CLI_APP_ID: nxb6t2e7b73c83e
      NEUX_CLI_KEY_NXB6T2E7B73C83E: ${{ secrets.NEUX_CLI_KEY_NXB6T2E7B73C83E }}

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate signed-service configuration
        run: |
          test -n "$NEUX_CLI_KEY_NXB6T2E7B73C83E"
          npx --no-install neux config doctor --json
      - name: Submit uploaded version for audit
        run: |
          npx --no-install neux submit \
            --version-id "${{ needs.upload-preview.outputs.version_id }}" \
            --json
